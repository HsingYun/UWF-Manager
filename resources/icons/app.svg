<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <path id="drive-body" d="M15.5 11h30a6 6 0 0 1 5.8 4.5L55 34v11a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5V34l3.7-18.5a6 6 0 0 1 5.8-4.5Z"/>
    <path id="shield-face" d="M43 22c5.1 2.9 10.5 4.2 15 4.7v11c0 10-6.4 16.6-15 20.8-8.6-4.2-15-10.8-15-20.8v-11c4.5-.5 9.9-1.8 15-4.7Z"/>
    <linearGradient id="drive-top" x1="30.5" y1="11" x2="30.5" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F7FC"/>
      <stop offset="1" stop-color="#CBD7E6"/>
    </linearGradient>
    <linearGradient id="drive-front" x1="30.5" y1="34" x2="30.5" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBC8D9"/>
      <stop offset="1" stop-color="#94A6BD"/>
    </linearGradient>
    <linearGradient id="shield-blue" x1="32" y1="24" x2="56" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C8BF5"/>
      <stop offset="1" stop-color="#1A5DC7"/>
    </linearGradient>
    <linearGradient id="shield-light" x1="30" y1="25" x2="48" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="drive-clip">
      <path d="M15.5 11h30a6 6 0 0 1 5.8 4.5L55 34v11a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5V34l3.7-18.5a6 6 0 0 1 5.8-4.5Z"/>
    </clipPath>
  </defs>
  <g id="drive">
    <use xlink:href="#drive-body" fill="#142B49" opacity=".1" transform="translate(0 1)"/>
    <use xlink:href="#drive-body" fill="url(#drive-top)"/>
    <path d="m9.5 32.5 4.1-15.8a3 3 0 0 1 2.9-2.2h28a3 3 0 0 1 2.9 2.2l4.1 15.8" fill="none" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M6 34h49v11a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5Z" fill="url(#drive-front)"/>
    <path d="M7 34.5h47" stroke="#FFFFFF" stroke-opacity=".48"/>
    <circle cx="15.5" cy="42" r="1.5" fill="#E6F8FF" stroke="#6D859C" stroke-width=".6"/>
  </g>
  <g id="shield">
    <g clip-path="url(#drive-clip)">
      <use xlink:href="#shield-face" fill="#193B63" opacity=".16" transform="translate(-1 1)"/>
    </g>
    <use xlink:href="#shield-face" fill="url(#shield-blue)" transform="translate(0 1)"/>
    <use xlink:href="#shield-face" fill="#0C244D" opacity=".15" transform="translate(0 1)"/>
    <use xlink:href="#shield-face" fill="url(#shield-blue)"/>
    <use xlink:href="#shield-face" fill="url(#shield-light)"/>
    <path d="M43 22v36.5c-8.6-4.2-15-10.8-15-20.8v-11c4.5-.5 9.9-1.8 15-4.7Z" fill="#FFFFFF" opacity=".07"/>
    <path d="M29 27.5c4.7-.6 9.3-1.9 14-4.5 4.7 2.6 9.3 3.9 14 4.5" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width=".65" stroke-linecap="round"/>
  </g>
</svg>
